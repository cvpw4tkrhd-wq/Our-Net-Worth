<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Privat budget</title>
<meta name="theme-color" content="#0B5C5C">
<meta name="description" content="Se vart dina egna pengar går varje månad. All data stannar i din webbläsare.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --line:#DDD7C9; --line2:#ECE8DE; --line3:#F1EEE6;
  --ink:#1B1F23; --muted:#5B6168; --soft:#4A5057;
  --accent:#0B5C5C; --accent-bg:#E3F1EF; --down:#27408B; --up:#8A4B00; --warn-bg:#FBF1DC; --warn-line:#E5CE95;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --nav-h:72px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
#main{padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
h1{margin:4px 0 0;font-size:24px;font-weight:600;line-height:1.2}
h2{margin:0;font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:var(--mono);font-weight:500}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:2px;margin-left:-10px}
.mrow .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:118px;text-align:center}
.iconbtn{width:44px;height:44px;border:0;background:none;color:var(--accent);display:grid;place-items:center;border-radius:12px}
.iconbtn:disabled{color:#B8B4A8;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin-top:14px}
.card.pad{padding:14px 16px}
.card.tight{border-radius:16px;padding:8px 12px 4px;margin-top:10px}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line2)}
.line:last-child{border-bottom:0}
.line .t{font-size:14px;font-weight:500}
.line .s{font-size:12px;color:var(--muted)}
.big{font-size:22px;color:var(--accent)}
.pills{display:flex;gap:8px;margin-top:10px}
.pill{flex:1;min-height:40px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:500;color:var(--soft);padding:0 10px}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.btn{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:14px;font-weight:600;color:var(--accent);padding:0 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#9A2B1F}
.btn.sm{min-height:40px;width:auto;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn+.btn{margin-top:10px}
.link{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;min-height:44px;padding:0 6px}
.dn{color:var(--down)} .up{color:var(--up)} .d0{color:var(--muted)}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.stack>*+*{margin-top:10px}
.banner{margin-top:14px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:14px}
.empty{margin-top:18px;background:#fff;border:1px dashed var(--line);border-radius:18px;padding:22px 18px;text-align:center}
.empty h2{margin-bottom:6px}
.empty p{color:var(--muted);font-size:14px;margin-bottom:14px}

/* tabell */
.tbl{display:grid;grid-template-columns:minmax(0,1fr) 46px 46px 52px 50px;gap:4px;align-items:center;font-family:var(--mono);font-weight:500;font-size:11.5px;text-align:right}
.tbl.h{padding:6px 0 8px;border-bottom:1px solid var(--line2);font-family:var(--sans);font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:400}
.tbl.r{height:38px;border-bottom:1px solid var(--line3)}
.tbl.f{height:42px}
.tbl .n{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:500;font-size:13px;text-align:left;min-width:0}
.tbl .n span.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl.f .n{font-weight:600}
.tbl .h0{text-align:left}

/* diagram */
.donutwrap{display:flex;align-items:center;gap:16px;padding:12px 0}
.legend{flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.9}
.legend .pc{margin-left:auto;font-family:var(--mono);font-weight:500;font-size:12px;color:var(--soft)}
.bars .b{padding:8px 0;border-bottom:1px solid var(--line3)}
.bars .b:last-child{border-bottom:0}
.bars .bt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bars .track{height:10px;background:var(--line3);border-radius:6px;overflow:hidden}
.bars .fill{height:100%;border-radius:6px}

/* lista */
.cat-row{width:100%;background:none;border:0;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;min-height:48px;padding:0;text-align:left;font-size:14px}
.cat-row:last-child{border-bottom:0}
.cat-row .amt{margin-left:auto;font-family:var(--mono);font-weight:500;font-size:14px}
.menu-btn{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;background:none;border:0;border-bottom:1px solid var(--line2);text-align:left;font-size:15px;font-weight:500;padding:0}
.menu-btn:last-child{border-bottom:0}
.menu-btn .chev{margin-left:auto;color:var(--muted)}
.tx{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border:0;border-bottom:1px solid var(--line3);background:none;text-align:left}
.tx .nm{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .am{font-family:var(--mono);font-weight:500;font-size:13px;text-align:right}
.tx .mt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;grid-column:1/3}
.search{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;margin-top:12px}

/* import */
.step{font-size:12px;color:var(--muted)}
textarea.paste{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;resize:vertical;font-size:14px;line-height:1.4}
.rv{padding:10px 0;border-bottom:1px solid var(--line3)}
.rv .top{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:500}
.rv .top .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .top .am{font-family:var(--mono);font-size:13px;white-space:nowrap}
.rv .bot{display:flex;align-items:center;gap:8px;margin-top:6px}
.rv .bot .dt{font-size:12px;color:var(--muted);min-width:42px}
.rv select{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 8px;font-size:14px}
.rv select.need{border-color:#D79B2B;background:var(--warn-bg)}
.rv.ign{opacity:.5}
.rv .x{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.actionbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);margin-top:16px;display:grid;gap:8px;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-top:10px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{max-width:520px;margin:0 auto;height:var(--nav-h);display:flex;justify-content:space-around;align-items:center;padding:0 6px}
#nav button{width:66px;min-height:56px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500}
#nav button[aria-current="page"]{color:var(--accent);font-weight:600}

/* sheet + toast */
.back{position:fixed;inset:0;background:rgba(27,31,35,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:18px;margin-bottom:4px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 130px;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line3)}
.field label{display:flex;align-items:center;gap:8px;font-size:14px}
.field input,.inp{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;text-align:right;font-family:var(--mono);font-weight:500;width:100%}
.inp.l{text-align:left;font-family:var(--sans);font-weight:400}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.chip{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;font-weight:500;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));background:#1B1F23;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;z-index:60;max-width:calc(100% - 40px);display:none;align-items:center;gap:12px}
#toast.on{display:flex}
#toast button{background:none;border:0;color:#9FD8D1;font-weight:600;font-size:14px;min-height:32px}
.snap{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.snap:last-child{border-bottom:0}
.snap .w{flex:1;min-width:0}
.snap .w .t{font-size:13px;font-weight:600}
.snap .w .s{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:8px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div id="app"><main id="main"></main></div>
<nav id="nav" aria-label="Huvudmeny"><div class="in"></div></nav>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-import" class="sr" accept=".csv,.txt,.tsv,.xlsx,.xls,.pdf,text/csv,text/plain" tabindex="-1">
<input type="file" id="file-restore" class="sr" accept=".json,application/json" tabindex="-1">

<script>
'use strict';
/* ============================================================
   Privat budget – en enda fil. All data ligger i webbläsaren.
   ============================================================ */
const APP_VERSION = '1.0.0';
const DATA_MODEL = 1;
const CHANGELOG = {
  '1.0.0': 'Första versionen: import (klistra in, CSV, Excel), automatisk kategorisering, Utgifter med månadsjämförelse, Trend och säkerhetskopior.'
};
const LS_KEY = 'pb_data_v1';
const LS_DRAFT = 'pb_draft_v1';
const LS_TOKEN = 'pb_gist_token';

const CATS = [
  { id: 'Boende', short: 'Boende', color: '#27408B' },
  { id: 'Mat', short: 'Mat', color: '#2AA198' },
  { id: 'Nöje & restaurang', short: 'Nöje & rest.', color: '#7A5CC2' },
  { id: 'Transport', short: 'Transport', color: '#E08A2C' },
  { id: 'Shopping', short: 'Shopping', color: '#C4457A' },
  { id: 'Abonnemang', short: 'Abonnemang', color: '#8A8F98' },
  { id: 'Hälsa', short: 'Hälsa', color: '#5AA5E8' },
  { id: 'Övrigt', short: 'Övrigt', color: '#C9B458' }
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const MON_SHORT = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];

/* ---------- små hjälpare ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf0 = new Intl.NumberFormat('sv-SE', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('sv-SE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = n => nf0.format(Math.round(n));
const fmt2 = n => nf2.format(n);
const round2 = n => Math.round(n * 100) / 100;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pad2 = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const monthOf = d => d.slice(0, 7);
function addMonths(mk, n) { let [y, m] = mk.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad2(m)}`; }
const monthLabel = mk => `${cap(MONTHS[+mk.slice(5) - 1])} ${mk.slice(0, 4)}`;
const monthName = mk => MONTHS[+mk.slice(5) - 1];
const monthShort = mk => cap(MON_SHORT[+mk.slice(5) - 1]);
const dayLabel = d => `${+d.slice(8)} ${MON_SHORT[+d.slice(5, 7) - 1]}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const currentMonth = () => isoDate(new Date()).slice(0, 7);

/* ---------- data ---------- */
function emptyDb() {
  return { model: DATA_MODEL, appVersion: APP_VERSION, tx: [], rules: [], shared: {}, settings: { remind: true, gistAuto: false }, meta: { lastImportAt: 0, lastSnapMonth: '', gistId: '', gistLast: 0 } };
}
function normalizeDb(d) {
  const base = emptyDb();
  if (!d || typeof d !== 'object') return base;
  const out = Object.assign(base, d);
  out.tx = Array.isArray(d.tx) ? d.tx.filter(t => t && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && isFinite(t.amount)) : [];
  out.rules = Array.isArray(d.rules) ? d.rules.filter(r => r && r.key && CAT[r.cat]) : [];
  out.shared = d.shared && typeof d.shared === 'object' ? d.shared : {};
  out.settings = Object.assign({ remind: true, gistAuto: false }, d.settings || {});
  out.meta = Object.assign({ lastImportAt: 0, lastSnapMonth: '', gistId: '', gistLast: 0 }, d.meta || {});
  out.model = DATA_MODEL;
  return out;
}
let db = emptyDb();
function loadDb() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) db = normalizeDb(JSON.parse(raw)); } catch (e) { console.warn('Kunde inte läsa data', e); }
}
let saveWarned = false;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast('Kunde inte spara i webbläsaren. Exportera en säkerhetskopia nu.'); } }
}
function exportObj() {
  return { app: 'privatbudget', appVersion: APP_VERSION, dataModel: DATA_MODEL, exportedAt: new Date().toISOString(),
    data: { tx: db.tx, rules: db.rules, shared: db.shared, settings: db.settings } };
}
function applyImported(obj) {
  const d = obj && obj.data;
  if (!obj || obj.app !== 'privatbudget' || !d) throw new Error('Filen är inte en säkerhetskopia från den här appen.');
  const keepMeta = db.meta;
  db = normalizeDb({ tx: d.tx, rules: d.rules, shared: d.shared, settings: d.settings, meta: keepMeta });
  db.appVersion = APP_VERSION;
  save();
}

/* ---------- återställningspunkter (IndexedDB) ---------- */
const idb = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB saknas'));
      const r = indexedDB.open('privatbudget', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('snaps', { keyPath: 'id', autoIncrement: true });
      r.onsuccess = () => { this._db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const tx = d.transaction('snaps', mode); const st = tx.objectStore('snaps');
      const req = fn(st);
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
    });
  },
  add(s) { return this.run('readwrite', st => st.add(s)); },
  all() { return this.run('readonly', st => st.getAll()).then(a => (a || []).sort((x, y) => y.at - x.at)); },
  get(id) { return this.run('readonly', st => st.get(id)); },
  del(id) { return this.run('readwrite', st => st.delete(id)); }
};
async function snapshot(label) {
  try {
    await idb.add({ at: Date.now(), label, appVersion: APP_VERSION, n: db.tx.length, json: JSON.stringify(exportObj()) });
    const all = await idb.all();
    for (const s of all.slice(10)) await idb.del(s.id);
  } catch (e) { console.warn('Kunde inte skapa återställningspunkt', e); }
}

/* ============================================================
   Parsning: datum, belopp, CSV, klistrad text
   ============================================================ */
const SV_MON = { jan: 1, feb: 2, mar: 3, apr: 4, maj: 5, jun: 6, jul: 7, aug: 8, sep: 9, okt: 10, nov: 11, dec: 12 };
function validYMD(y, m, d) { if (m < 1 || m > 12 || d < 1 || d > 31) return null; const t = new Date(y, m - 1, d); return t.getMonth() === m - 1 ? `${y}-${pad2(m)}-${pad2(d)}` : null; }
function inferYear(m, d) {
  const now = new Date(); let y = now.getFullYear();
  const cand = new Date(y, m - 1, d);
  if (cand.getTime() > now.getTime() + 2 * 86400000) y -= 1;
  return y;
}
/* Hittar ett datum någonstans i en rad. Returnerar { date, start, end } eller null */
function findDate(s) {
  let m;
  if ((m = /(?<!\d)(\d{4})-(\d{2})-(\d{2})(?!\d)/.exec(s))) { const d = validYMD(+m[1], +m[2], +m[3]); if (d) return { date: d, start: m.index, end: m.index + m[0].length }; }
  if ((m = /(?<!\d)(\d{1,2})[./](\d{1,2})[./](\d{2,4})(?!\d)/.exec(s))) {
    let y = +m[3]; if (y < 100) y += 2000; const d = validYMD(y, +m[2], +m[1]); if (d) return { date: d, start: m.index, end: m.index + m[0].length };
  }
  if ((m = /(?<![\d.,])(\d{1,2})\s+(jan|feb|mar|apr|maj|jun|jul|aug|sep|okt|nov|dec)[a-zåä]*\.?(?:\s+(\d{4}))?(?![\d])/i.exec(s))) {
    const mo = SV_MON[m[2].toLowerCase()]; const dd = +m[1]; const y = m[3] ? +m[3] : inferYear(mo, dd);
    const d = validYMD(y, mo, dd); if (d) return { date: d, start: m.index, end: m.index + m[0].length };
  }
  if ((m = /(?<![\d.,])(\d{1,2})\/(\d{1,2})(?![\d/.,])/.exec(s))) {
    const d = validYMD(inferYear(+m[2], +m[1]), +m[2], +m[1]); if (d) return { date: d, start: m.index, end: m.index + m[0].length };
  }
  if ((m = /(?<![a-zåäö])(idag|igår|i går)(?![a-zåäö])/i.exec(s))) {
    const dt = new Date(); if (/g.r/i.test(m[1])) dt.setDate(dt.getDate() - 1);
    return { date: isoDate(dt), start: m.index, end: m.index + m[0].length };
  }
  return null;
}
/* Datum i en tabellcell (hela cellen ska vara ett datum) */
function parseDateCell(v) {

function monthData(mk) {

  for (const c of CATS) { own[c.id] = 0; half[c.id] = 0; }
  for (const t of db.tx) if (t.date.startsWith(mk) && own[t.cat] !== undefined) own[t.cat] += t.amount;
  const sh = db.shared[mk] || {}; let sharedFull = 0;
  for (const c of CATS) { const v = +sh[c.id] || 0; half[c.id] = v / 2; sharedFull += v; }
  const cat = {}; let ownTotal = 0, halfTotal = 0;
  for (const c of CATS) { cat[c.id] = own[c.id] + half[c.id]; ownTotal += own[c.id]; halfTotal += half[c.id]; }

}
function hasData(mk) { const d = monthData(mk); return d.ownTotal > 0 || d.halfTotal > 0; }

}

    if (S.chart === 'donut') h += `<div class="donutwrap">${donut(items, total)}<div class="legend">${items.slice(0, 8).map(it => `<div><span class="dot" style="background:${it.color}"></span>${esc(CAT[it.id].short)}<span class="pc">${Math.round(it.v / total * 100)} %</span></div>`).join('')}</div></div>`;
    else { const mx = Math.max(...items.map(i => i.v)); h += `<div class="bars">${items.map(it => `<div class="b"><div class="bt"><span><span class="dot" style="background:${it.color};margin-right:8px"></span>${esc(CAT[it.id].short)}</span><span class="mono" style="font-size:12px">${fmt(it.v)} kr</span></div><div class="track"><div class="fill" style="width:${(it.v / mx * 100).toFixed(1)}%;background:${it.color}"></div></div></div>`).join('')}</div>`; }
    h += `</div>`;

  }

/* ---------- Trend ---------- */
function viewTrend() {
  const months = []; for (let i = 5; i >= 0; i--) months.push(addMonths(S.month, -i));
  const data = months.map(m => ({ m, ...monthData(m) }));
  let h = head('Trend', { eyebrow: 'Senaste 6 månaderna' });
  if (!data.some(x => x.total > 0)) return h + emptyState();
  const maxV = Math.max(...data.map(x => x.total)); const top = Math.max(10000, Math.ceil(maxV / 10000) * 10000);
  const W = 350, H = 210, L = 34, B = 26, T = 22, bw = 28; const slot = (W - L) / data.length; const ph = H - B - T;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Utgifter per månad">`;
  for (const g of [0, top / 2, top]) { const y = T + ph - g / top * ph; svg += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#ECE8DE"/><text x="${L - 6}" y="${y + 3}" text-anchor="end" font-size="9" fill="#5B6168" font-family="IBM Plex Mono, monospace">${g === 0 ? '0' : (g / 1000) + 'k'}</text>`; }
  data.forEach((x, i) => {
    const cx = L + slot * i + slot / 2; const ho = x.ownTotal / top * ph, hs = x.halfTotal / top * ph; const yo = T + ph - ho; const ys = yo - hs;
    svg += `<rect x="${cx - bw / 2}" y="${yo}" width="${bw}" height="${Math.max(ho, 0)}" fill="#0B5C5C" rx="2"/>`;
    svg += `<rect x="${cx - bw / 2}" y="${ys}" width="${bw}" height="${Math.max(hs, 0)}" fill="#7FB8B0" rx="2"/>`;
    if (x.total > 0) svg += `<text x="${cx}" y="${ys - 5}" text-anchor="middle" font-size="9.5" fill="#1B1F23" font-family="IBM Plex Mono, monospace">${(x.total / 1000).toFixed(1).replace('.', ',')}</text>`;
    svg += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#5B6168" font-family="IBM Plex Sans, sans-serif">${monthShort(x.m)}</text>`;
  });
  svg += '</svg>';
  h += `<div class="card pad">${svg}<div style="display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:4px"><span><span class="dot" style="background:#0B5C5C;margin-right:6px"></span>Egna</span><span><span class="dot" style="background:#7FB8B0;margin-right:6px"></span>Gemensamt (hälften)</span><span style="margin-left:auto">tusen kr</span></div></div>`;
  const withData = data.filter(x => x.total > 0); const avg = withData.reduce((a, x) => a + x.total, 0) / withData.length; const hi = withData.reduce((a, x) => x.total > a.total ? x : a, withData[0]);
  h += `<div class="card"><div class="line"><div class="t">Snitt per månad</div><div class="mono">${fmt(avg)} kr</div></div><div class="line"><div><div class="t">Dyrast</div><div class="s">${monthName(hi.m)}</div></div><div class="mono">${fmt(hi.total)} kr</div></div></div>`;
  const b = baseline(S.month, 'prev');
  if (b) {
    const cur = monthData(S.month); const ch = CATS.map(c => ({ id: c.id, dl: cur.cat[c.id] - b.cat[c.id] })).filter(x => Math.round(x.dl) !== 0).sort((a, c) => Math.abs(c.dl) - Math.abs(a.dl)).slice(0, 4);
    if (ch.length) h += `<h2 style="margin:18px 0 0;font-size:14px">Största förändring mot ${b.label}</h2><div class="card" style="margin-top:8px">${ch.map(x => `<div class="line"><div class="t" style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${CAT[x.id].color}"></span>${esc(CAT[x.id].id)}</div><div class="mono">${deltaHtml(x.dl)} kr</div></div>`).join('')}</div>`;
  }
  h += `<div class="pills"><button class="pill" data-a="mprev">‹ Tidigare</button><button class="pill" data-a="mnext" ${S.month >= currentMonth() ? 'disabled' : ''}>Senare ›</button></div>`;
  return h;
}

  <div class="pills" style="margin-top:0"><button class="pill" style="min-height:36px" data-a="sign" data-v="neg" aria-pressed="${im.sign === 'neg'}">minusbelopp</button><button class="pill" style="min-height:36px" data-a="sign" data-v="pos" aria-pressed="${im.sign === 'pos'}">plusbelopp</button></div></div>
  <div class="pills"><button class="pill" data-a="rvfilter" data-v="help" aria-pressed="${im.filter === 'help'}">Behöver hjälp (${c.help})</button><button class="pill" data-a="rvfilter" data-v="all" aria-pressed="${im.filter === 'all'}">Alla (${c.total})</button></div>
  <div class="card" style="padding:2px 14px">${shown.length ? shown.map(r => `<div class="rv ${r.ign ? 'ign' : ''}"><div class="top"><span class="nm">${esc(r.text)}</span><span class="am">−${fmt2(r.amount)}</span></div><div class="bot"><span class="dt">${dayLabel(r.date)}</span>${r.ign ? '<span class="muted small" style="flex:1">Ignorerad</span>' : `<select class="${r.cat === null ? 'need' : ''}" data-change="rvcat" data-id="${r.id}" aria-label="Kategori för ${esc(r.text)}">${opts(r.cat)}</select>`}<button class="x" data-a="rvign" data-id="${r.id}" aria-label="${r.ign ? 'Ångra ignorera' : 'Ignorera rad'}">${r.ign ? '↺' : '×'}</button></div></div>`).join('') : `<p class="muted" style="padding:14px 0;font-size:14px">${im.filter === 'help' ? 'Alla rader har en kategori.' : 'Inga rader.'}</p>`}${rows.length > shown.length ? `<div style="padding:10px 0"><button class="btn" data-a="rvmore">Visa fler (${rows.length - shown.length} kvar)</button></div>` : ''}</div>
  <div class="actionbar"><button class="btn primary" data-a="rvsave" ${c.active ? '' : 'disabled'}>Spara ${c.active} rader</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" style="margin:0" data-a="rvdraft">Spara och gör klart senare</button><button class="btn danger" style="margin:0" data-a="rvcancel">Avbryt</button></div></div>`;
}
let rowSeq = 1;
function buildReview(items, label, sign) {
  const exist = new Set(db.tx.map(t => t.k).filter(Boolean));
  const seen = {}; const rows = []; let dupes = 0, skipped = 0;
  const rules = [...db.rules];
  for (const it of items) {
    const isExp = sign === 'neg' ? it.raw < 0 : it.raw > 0;
    if (!isExp) { if (it.raw !== 0) skipped++; continue; }
    const amount = round2(Math.abs(it.raw));
    const base = `${it.date}|${it.text.toLowerCase().replace(/\s+/g, ' ')}|${amount.toFixed(2)}`;
    seen[base] = (seen[base] || 0) + 1; const k = `${base}|${seen[base]}`;
    if (exist.has(k)) { dupes++; continue; }
    rows.push({ id: 'r' + rowSeq++, date: it.date, text: it.text, amount, cat: categorize(it.text, rules), k, manual: false, ign: false });
  }
  return { label, sign, rows, dupes, skipped, remember: true, filter: 'help', limit: 100, newRules: [], items };
}
function startReview(items, label) {
  if (!items.length) { toast('Hittade inga transaktioner. Kontrollera att datum, text och belopp finns med, eller klistra in tabellen.'); return; }
  const neg = items.filter(i => i.raw < 0).length, pos = items.filter(i => i.raw > 0).length;
  const sign = neg >= pos ? 'neg' : 'pos';
  S.import = buildReview(items, label, sign);
  if (!S.import.rows.length) {
    const im = S.import; S.import = null;
    toast(im.dupes ? `Alla ${im.dupes} rader finns redan importerade.` : 'Inga utgifter hittades. Prova att byta mellan minus- och plusbelopp.');
    render(); return;
  }
  render();
}
async function loadXlsx() {
  if (window.XLSX) return;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('Kunde inte ladda Excel-läsaren. Är du online?')); document.head.appendChild(s); });
}
async function handleFile(file) {
  const name = file.name; const ext = name.split('.').pop().toLowerCase();
  try {
    let items = [];
    if (ext === 'pdf') { toast('PDF stöds inte än. Använd CSV, Excel eller klistra in text.'); return; }
    if (ext === 'xlsx' || ext === 'xls') {
      toast('Läser Excel-filen …');
      await loadXlsx(); const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      for (const sn of wb.SheetNames) { const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' }); items = tableToItems(rows); if (items.length) break; }
    } else {
      const text = await decodeBuffer(await file.arrayBuffer()); items = parseText(text);
    }
    startReview(items, name);
  } catch (e) { toast(e.message || 'Kunde inte läsa filen.'); }
}
function reapplyRules(im) {
  const rules = [...db.rules, ...im.newRules];
  for (const r of im.rows) if (!r.manual) r.cat = categorize(r.text, rules);
}
async function saveImport() {
  const im = S.import; if (!im) return;
  const act = im.rows.filter(r => !r.ign); const help = act.filter(r => r.cat === null).length;
  if (help && !confirm(`${help} rader saknar kategori. De läggs under Övrigt och kan ändras i Mer > Transaktioner. Spara ändå?`)) return;
  await snapshot('Före import av ' + im.label);
  for (const r of act) db.tx.push({ id: uid(), date: r.date, text: r.text, amount: r.amount, cat: r.cat || 'Övrigt', k: r.k });
  for (const r of im.newRules) setRule(db.rules, r.key, r.cat);
  db.meta.lastImportAt = Date.now();
  const newest = act.map(r => r.date).sort().pop(); if (newest) S.month = monthOf(newest);
  save(); try { localStorage.removeItem(LS_DRAFT); } catch (e) { }
  S.import = null; S.view = 'expenses'; render(); toast(`${act.length} rader sparade`);
  refreshSnaps();
}

/* ---------- Sheets ---------- */
function openSheet(html, focusSel) {
  closeSheet();
  const root = $('#sheet-root'); root.innerHTML = `<div class="back" data-a="sheetclose"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = focusSel && $(focusSel, root); if (f) f.focus();
}
function closeSheet() { $('#sheet-root').innerHTML = ''; }
function sharedSheet() {
  const mk = S.month; const cur = db.shared[mk] || {};
  const inputs = CATS.map((c, i) => `<div class="field"><label for="sh${i}"><span class="dot" style="background:${c.color}"></span>${esc(c.id)}</label><input id="sh${i}" data-cat="${esc(c.id)}" inputmode="decimal" placeholder="0" value="${cur[c.id] ? String(cur[c.id]).replace('.', ',') : ''}" data-change="shsum" data-input="shsum"></div>`).join('');
  openSheet(`<h2>Gemensamma utgifter</h2><p class="note" style="margin:0 0 8px">Skriv in hushållets summa per kategori för ${monthName(mk)}. Appen räknar din hälft. Ingen koppling till hushållsbudgeten.</p>${inputs}
  <div class="line" style="margin-top:6px"><div class="t">Hushållets summa</div><div class="mono" id="sh-full">0 kr</div></div><div class="line"><div class="t" style="font-weight:600">Din hälft</div><div class="mono big" id="sh-half">0 kr</div></div>
  <div class="stack" style="margin-top:12px"><button class="btn primary" data-a="shsave">Spara</button><button class="btn" data-a="shcopy">Kopiera från ${monthName(addMonths(mk, -1))}</button><button class="btn" data-a="sheetclose" style="color:var(--soft)">Avbryt</button></div>`, '#sh0');
  shSum();
}
function shSum() {
  let sum = 0; document.querySelectorAll('#sheet-root input[data-cat]').forEach(i => { sum += parseAmount(i.value) || 0; });
  const f = $('#sh-full'), h = $('#sh-half'); if (f) f.textContent = fmt(sum) + ' kr'; if (h) h.textContent = fmt(sum / 2) + ' kr';
}
function txSheet(id) {
  const t = db.tx.find(x => x.id === id); if (!t) return; const key = normKey(t.text);
  const same = key ? db.tx.filter(x => normKey(x.text) === key).length : 1;
  openSheet(`<h2 style="overflow-wrap:anywhere">${esc(t.text)}</h2><p class="small muted">${dayLabel(t.date)} · −${fmt2(t.amount)} kr</p>
  <div class="chips">${CATS.map(c => `<button class="chip" data-a="txsetcat" data-id="${t.id}" data-cat="${esc(c.id)}" aria-pressed="${t.cat === c.id}"><span class="dot" style="background:${c.color}"></span>${esc(c.short)}</button>`).join('')}</div>
  ${key && same > 1 ? `<div class="check" style="margin-top:8px"><input type="checkbox" id="tx-all" checked><label for="tx-all">Gäller alla ${same} köp som liknar “${esc(key)}” och framtida importer</label></div>` : (key ? `<div class="check" style="margin-top:8px"><input type="checkbox" id="tx-all" checked><label for="tx-all">Kom ihåg för “${esc(key)}” vid framtida importer</label></div>` : '')}
  <div class="stack" style="margin-top:12px"><button class="btn danger" data-a="txdel" data-id="${t.id}">Ta bort transaktionen</button><button class="btn" data-a="sheetclose" style="color:var(--soft)">Stäng</button></div>`);
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, action) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button data-a="${action.a}">${esc(action.label)}</button>` : ''}`; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), action ? 9000 : 4200);
}

/* ---------- Backup-åtgärder ---------- */
function download(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function gistSave(silent) {
  const token = localStorage.getItem(LS_TOKEN); if (!token) { if (!silent) toast('Klistra in en GitHub-token först.'); return false; }
  try {
    const body = { description: 'Privat budget – säkerhetskopia', public: false, files: { 'privatbudget-backup.json': { content: JSON.stringify(exportObj()) } } };
    const r = await fetch('https://api.github.com/gists' + (db.meta.gistId ? '/' + db.meta.gistId : ''), { method: db.meta.gistId ? 'PATCH' : 'POST', headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status === 401 ? 'GitHub avvisade token (401). Kontrollera behörigheten gist.' : r.status === 404 ? 'Gisten hittades inte (404). Töm Gist-id och försök igen.' : 'GitHub svarade ' + r.status);
    const j = await r.json(); db.meta.gistId = j.id; db.meta.gistLast = Date.now(); save();
    if (!silent) toast('Kopia sparad i din Gist'); return true;
  } catch (e) { toast(silent ? 'Automatisk Gist-kopia misslyckades: ' + e.message : e.message); return false; }
}
async function gistRestore() {
  const token = localStorage.getItem(LS_TOKEN); if (!token || !db.meta.gistId) { toast('Ingen Gist-kopia att hämta.'); return; }
  try {
    const r = await fetch('https://api.github.com/gists/' + db.meta.gistId, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('GitHub svarade ' + r.status);
    const j = await r.json(); const f = j.files['privatbudget-backup.json'] || Object.values(j.files)[0];
    let content = f.content; if (f.truncated) content = await (await fetch(f.raw_url)).text();
    const obj = JSON.parse(content);
    if (!confirm(`Ersätta nuvarande data (${db.tx.length} transaktioner) med kopian (${(obj.data?.tx || []).length})? En återställningspunkt skapas först.`)) return;
    await snapshot('Före återställning från Gist'); applyImported(obj); render(true); toast('Återställt från Gist'); refreshSnaps();
  } catch (e) { toast(e.message || 'Kunde inte hämta kopian.'); }
}

/* ============================================================
   Händelser
   ============================================================ */
const ACT = {
  nav(el) { S.view = el.dataset.v; S.sub = null; render(); },
  back() { S.sub = null; render(); },
  sub(el) { S.sub = el.dataset.v; if (S.sub === 'backup') refreshSnaps(true); S.txCat = null; S.txQ = ''; S.txLimit = 150; render(); },
  mprev() { S.month = addMonths(S.month, -1); render(true); },
  mnext() { if (S.month < currentMonth()) { S.month = addMonths(S.month, 1); render(true); } },
  basis(el) { S.basis = el.dataset.v; render(true); },
  chart(el) { S.chart = el.dataset.v; render(true); },
  cmp(el) { S.cmp = el.dataset.v; render(true); },
  catdetail(el) { S.view = 'more'; S.sub = 'tx'; S.txCat = el.dataset.v; S.txQ = ''; S.txLimit = 150; render(); },
  txcat(el) { S.txCat = el.dataset.v || null; S.txLimit = 150; render(true); },
  txmore() { S.txLimit += 150; $('#txlist').innerHTML = txListHtml(); },
  txedit(el) { txSheet(el.dataset.id); },
  txsetcat(el) {
    const t = db.tx.find(x => x.id === el.dataset.id); if (!t) return; const cat = el.dataset.cat; const all = $('#tx-all'); const key = normKey(t.text);
    t.cat = cat; let n = 1;
    if (all && all.checked && key) { setRule(db.rules, key, cat); n = 0; for (const x of db.tx) if (normKey(x.text) === key) { x.cat = cat; n++; } }
    save(); closeSheet(); render(true); toast(n > 1 ? `${n} transaktioner flyttade till ${cat}` : `Flyttad till ${cat}`);
  },
  txdel(el) { if (!confirm('Ta bort transaktionen?')) return; db.tx = db.tx.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(true); },
  shared() { sharedSheet(); },
  shcopy() { const prev = db.shared[addMonths(S.month, -1)]; if (!prev) { toast(`Inget inskrivet för ${monthName(addMonths(S.month, -1))}.`); return; } document.querySelectorAll('#sheet-root input[data-cat]').forEach(i => { const v = prev[i.dataset.cat]; i.value = v ? String(v).replace('.', ',') : ''; }); shSum(); },
  shsave() {
    const o = {}; document.querySelectorAll('#sheet-root input[data-cat]').forEach(i => { const v = parseAmount(i.value); if (v && v > 0) o[i.dataset.cat] = round2(v); });
    if (Object.keys(o).length) db.shared[S.month] = o; else delete db.shared[S.month];
    save(); closeSheet(); render(true); toast('Gemensamma utgifter sparade');
  },
  sheetclose(el, e) { if (e.target === el || el.tagName === 'BUTTON') closeSheet(); },
  pickfile() { const i = $('#file-import'); i.value = ''; i.click(); },
  parsepaste() { const v = $('#paste').value; if (!v.trim()) { toast('Klistra in text först.'); return; } startReview(parseText(v), 'Inklistrad text'); },
  sign(el) { const im = S.import; im.sign = el.dataset.v; const nb = buildReview(im.items, im.label, im.sign); nb.remember = im.remember; S.import = nb; render(true); },
  rvfilter(el) { S.import.filter = el.dataset.v; S.import.limit = 100; render(true); },
  rvmore() { S.import.limit += 100; render(true); },
  rvign(el) { const r = S.import.rows.find(x => x.id === el.dataset.id); r.ign = !r.ign; render(true); },
  rvsave() { saveImport(); },
  rvdraft() { try { localStorage.setItem(LS_DRAFT, JSON.stringify(S.import)); toast('Importen är sparad. Du hittar den under Importera.'); S.import = null; render(); } catch (e) { toast('Kunde inte spara utkastet.'); } },
  rvcancel() { if (confirm('Avbryta importen? Inget har sparats.')) { S.import = null; render(); } },
  draftresume() { try { S.import = JSON.parse(localStorage.getItem(LS_DRAFT)); localStorage.removeItem(LS_DRAFT); rowSeq = Math.max(rowSeq, S.import.rows.length + 1000); render(); } catch (e) { toast('Utkastet kunde inte läsas.'); } },
  ruleadd() {
    const k = normKey($('#rule-key').value); const c = $('#rule-cat').value; if (!k) { toast('Skriv in en butik eller ett ord.'); return; }
    setRule(db.rules, k, c); let n = 0; for (const x of db.tx) if (normKey(x.text) === k && x.cat !== c) { x.cat = c; n++; }
    save(); render(true); toast(n ? `Regel sparad, ${n} transaktioner flyttades` : 'Regel sparad');
  },
  ruledel(el) { db.rules = db.rules.filter(r => r.key !== el.dataset.k); save(); render(true); },
  export() { download(`privatbudget-backup-${isoDate(new Date())}.json`, JSON.stringify(exportObj())); toast('Säkerhetskopian är nedladdad'); },
  restorefile() { const i = $('#file-restore'); i.value = ''; i.click(); },
  gistsave() { const v = $('#gist-token').value.trim(); if (v) localStorage.setItem(LS_TOKEN, v); gistSave(false).then(() => render(true)); },
  gistrestore() { gistRestore(); },
  async snaprestore(el) {
    const s = await idb.get(+el.dataset.id); if (!s) return;
    if (!confirm(`Återställa till ${new Date(s.at).toLocaleString('sv-SE', { dateStyle: 'medium', timeStyle: 'short' })} (${s.n} transaktioner)? Nuvarande data sparas först som en ny återställningspunkt.`)) return;
    await snapshot('Före återställning'); try { applyImported(JSON.parse(s.json)); } catch (e) { toast(e.message); return; }
    await refreshSnaps(); render(true); toast('Återställt');
  },
  checkupdate() { if (!navigator.serviceWorker) { toast('Uppdateringar hanteras av webbläsaren.'); return; } navigator.serviceWorker.getRegistration().then(r => r ? r.update().then(() => toast('Du har den senaste versionen, eller så laddas en ny i bakgrunden.')) : toast('Ingen uppdatering hittades.')); },
  reload() { location.reload(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = ACT[el.dataset.a]; if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target; const k = el.dataset && el.dataset.change; if (!k) return;
  if (k === 'rvcat') {
    const im = S.import; const r = im.rows.find(x => x.id === el.dataset.id); if (!r) return;
    r.cat = el.value || null; r.manual = true;
    if (el.value && im.remember) { const key = normKey(r.text); if (key) { setRule(im.newRules, key, el.value); reapplyRules(im); } }
    render(true);
  } else if (k === 'remember') { S.import.remember = el.checked; }
  else if (k === 'remind') { db.settings.remind = el.checked; save(); }
  else if (k === 'gistauto') { db.settings.gistAuto = el.checked; save(); const v = $('#gist-token'); if (v && v.value.trim()) localStorage.setItem(LS_TOKEN, v.value.trim()); }
  else if (k === 'shsum') shSum();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'txq') { S.txQ = el.value; S.txLimit = 150; $('#txlist').innerHTML = txListHtml(); }
  else if (el.dataset && el.dataset.input === 'shsum') shSum();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#file-import').addEventListener('change', e => { const f = e.target.files[0]; if (f) handleFile(f); });
$('#file-restore').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const obj = JSON.parse(await decodeBuffer(await f.arrayBuffer()));
    if (!obj || obj.app !== 'privatbudget') throw new Error('Filen är inte en säkerhetskopia från den här appen.');
    if (!confirm(`Ersätta nuvarande data (${db.tx.length} transaktioner) med kopian (${(obj.data?.tx || []).length})? En återställningspunkt skapas först.`)) return;
    await snapshot('Före återställning från fil'); applyImported(obj); await refreshSnaps(); render(true); toast('Återställt från fil');
  } catch (err) { toast(err.message || 'Kunde inte läsa filen.'); }
});

/* ============================================================
   Start
   ============================================================ */
async function boot() {
  loadDb();
  const months = allMonthsWithData(); S.month = months.length ? months[months.length - 1] : currentMonth();
  if (db.tx.length) {
    if (db.appVersion && db.appVersion !== APP_VERSION) await snapshot(`Före uppdatering till v${APP_VERSION}`);
    if (db.meta.lastSnapMonth !== currentMonth()) { await snapshot('Månadsskifte'); db.meta.lastSnapMonth = currentMonth(); }
  }
  db.appVersion = APP_VERSION; save();
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  if (db.settings.gistAuto && db.tx.length && localStorage.getItem(LS_TOKEN) && Date.now() - (db.meta.gistLast || 0) > 7 * 86400000) gistSave(true);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./sw.js').catch(() => { });
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('Appen har uppdaterats.', { a: 'reload', label: 'Ladda om' }); });
  }
}
boot();
