<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Net Worth</title>
<meta name="theme-color" content="#0B5C5C">
<meta name="description" content="Vad vi har sparat nu och vad vi kan ha om några år. All data stannar i din webbläsare.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Net Worth">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --line:#DDD7C9; --line2:#ECE8DE; --line3:#F1EEE6;
  --ink:#1B1F23; --muted:#5B6168; --soft:#4A5057;
  --accent:#0B5C5C; --accent-bg:#E3F1EF; --pos:#0B5C5C; --neg:#9A2B1F; --warn-bg:#FBF1DC; --warn-line:#E5CE95;
  --ca:#0B5C5C; --cb:#E08A2C; --cs:#7A5CC2;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --nav-h:72px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh}
#main{padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
h1{margin:4px 0 0;font-size:24px;font-weight:600;line-height:1.2}
h2{margin:0;font-size:16px;font-weight:600}
h3{margin:20px 0 0;font-size:14px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:12px}
.mono{font-family:var(--mono);font-weight:500}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:2px;margin-left:-10px}
.mrow .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:118px;text-align:center}
.iconbtn{width:44px;height:44px;border:0;background:none;color:var(--accent);display:grid;place-items:center;border-radius:12px}
.iconbtn:disabled{color:#B8B4A8;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin-top:14px}
.card.pad{padding:14px 16px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.line:last-child{border-bottom:0}
.line .t{font-size:14px;font-weight:500}
.line .s{font-size:12px;color:var(--muted)}
.line .mono{white-space:nowrap}
.big{font-size:26px;color:var(--accent)}
.pills{display:flex;gap:8px;margin-top:10px}
.pill{flex:1;min-height:40px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:500;color:var(--soft);padding:0 8px}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.btn{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:14px;font-weight:600;color:var(--accent);padding:0 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--neg)}
.btn.sm{min-height:40px;width:auto;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn+.btn{margin-top:10px}
.link{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;min-height:44px;padding:0 6px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.stack>*+*{margin-top:10px}
.banner{margin-top:14px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:14px}
.empty{margin-top:18px;background:#fff;border:1px dashed var(--line);border-radius:18px;padding:22px 18px}
.empty h2{margin-bottom:6px}
.empty p{color:var(--muted);font-size:14px;margin-bottom:14px}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:8px}
.inp{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;width:100%}
.inp.num{text-align:right;font-family:var(--mono);font-weight:500}
.lbl2{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:10px;padding:8px 0 2px}
.field label{font-size:14px;font-weight:500}
.field .hint{display:block;font-size:12px;color:var(--muted);font-weight:400}
.fd{font-size:12px;color:var(--muted);text-align:right;min-height:18px;padding-bottom:8px;border-bottom:1px solid var(--line3);font-family:var(--mono)}
.fd:last-child{border-bottom:0}
.gh{display:flex;align-items:center;gap:8px;margin:22px 0 0;font-size:14px;font-weight:600}
.gh .tot{margin-left:auto;font-family:var(--mono);font-weight:500;font-size:13px;color:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tbl{display:grid;grid-template-columns:42px repeat(3,minmax(0,1fr)) minmax(0,1.2fr);gap:4px;align-items:center;font-family:var(--mono);font-weight:500;font-size:11.5px;text-align:right}
.tbl.h{padding:6px 0 8px;border-bottom:1px solid var(--line2);font-family:var(--sans);font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:400}
.tbl.r{height:36px;border-bottom:1px solid var(--line3)}
.tbl.r:last-child{border-bottom:0}
.tbl .y{font-family:var(--sans);font-weight:500;font-size:12.5px;text-align:left}
.tbl .tt{font-weight:600}
.menu-btn{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;background:none;border:0;border-bottom:1px solid var(--line2);text-align:left;font-size:15px;font-weight:500;padding:0}
.menu-btn:last-child{border-bottom:0}
.menu-btn .chev{margin-left:auto;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.snap{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.snap:last-child{border-bottom:0}
.snap .w{flex:1;min-width:0}
.snap .w .t{font-size:14px;font-weight:600}
.snap .w .s{font-size:12px;color:var(--muted)}
.actionbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);margin-top:16px;display:grid;gap:8px;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-top:10px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{max-width:520px;margin:0 auto;height:var(--nav-h);display:flex;justify-content:space-around;align-items:center;padding:0 6px}
#nav button{width:66px;min-height:56px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500}
#nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.back{position:fixed;inset:0;background:rgba(27,31,35,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:18px;margin-bottom:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));background:#1B1F23;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;z-index:60;max-width:calc(100% - 40px);display:none;align-items:center;gap:12px}
#toast.on{display:flex}
#toast button{background:none;border:0;color:#9FD8D1;font-weight:600;font-size:14px;min-height:32px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div id="app"><main id="main"></main></div>
<nav id="nav" aria-label="Huvudmeny"><div class="in"></div></nav>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-restore" class="sr" accept=".json,application/json" tabindex="-1">

<script>
'use strict';
/* ============================================================
   Our Net Worth – en enda fil. All data ligger i webbläsaren.
   ============================================================ */
const APP_VERSION = '1.0.0';
const DATA_MODEL = 1;
const CHANGELOG = { '1.0.0': 'Första versionen: saldon per månad för två personer och gemensamt, översikt, prognos år för år och säkerhetskopior.' };
const LS_KEY = 'onw_data_v1';
const LS_TOKEN = 'onw_gist_token';

const KINDS = {
  saving: { label: 'Sparande', ret: 2, hint: '' },
  invest: { label: 'Börs eller fonder', ret: 7, hint: '' },
  amort: { label: 'Amortering (hittills)', ret: 0, hint: 'Summa amorterat hittills' },
  fixed: { label: 'Fast belopp', ret: 0, hint: '' },
  appr: { label: 'Värdeökning (estimerad)', ret: 3, hint: 'Estimerad värdeökning sedan köp, totalt' }
};
const DEFAULT_POSTS = [
  { id: 'a-spar', owner: 'a', kind: 'saving', name: 'Privat sparande' },
  { id: 'a-bors', owner: 'a', kind: 'invest', name: 'Börskonto' },
  { id: 'b-spar', owner: 'b', kind: 'saving', name: 'Privat sparande' },
  { id: 'b-bors', owner: 'b', kind: 'invest', name: 'Börskonto' },
  { id: 's-insats', owner: 's', kind: 'fixed', name: 'Kontantinsats' },
  { id: 's-amort', owner: 's', kind: 'amort', name: 'Amortering' },
  { id: 's-varde', owner: 's', kind: 'appr', name: 'Värdeökning lägenhet' }
];
const MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const MON_SHORT = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];

/* ---------- hjälpare ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf0 = new Intl.NumberFormat('sv-SE', { maximumFractionDigits: 0 });
const fmt = n => nf0.format(Math.round(n));
const fmtS = n => { const r = Math.round(n); return (r > 0 ? '+' : r < 0 ? '' : '±') + nf0.format(r); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pad2 = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const currentMonth = () => isoDate(new Date()).slice(0, 7);
function addMonths(mk, n) { let [y, m] = mk.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad2(m)}`; }
const monthLabel = mk => `${cap(MONTHS[+mk.slice(5) - 1])} ${mk.slice(0, 4)}`;
const monthName = mk => MONTHS[+mk.slice(5) - 1];
const monthShort = mk => cap(MON_SHORT[+mk.slice(5) - 1]);
const monthsBetween = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5) - +a.slice(5));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function parseNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v ?? '').trim(); if (!s) return null;
  s = s.replace(/\u2212|\u2013/g, '-').replace(/[\s\u00a0\u202f]/g, '').replace(/kr|sek|%/gi, '');
  if (!/^[-+]?[\d.,]+$/.test(s) || !/\d/.test(s)) return null;
  const neg = s.startsWith('-'); s = s.replace(/^[-+]/, '');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc >= 0 && ld >= 0) { s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); }
  else if (lc >= 0) { s = (s.match(/,/g) || []).length > 1 ? s.replace(/,/g, '') : s.replace(',', '.'); }
  else if (ld >= 0 && (/^\d{1,3}(\.\d{3})+$/.test(s) || (s.match(/\./g) || []).length > 1)) s = s.replace(/\./g, '');
  const n = parseFloat(s); return isFinite(n) ? (neg ? -n : n) : null;
}

/* ---------- data ---------- */
function emptyDb() {
  return { model: DATA_MODEL, appVersion: APP_VERSION,
    settings: { nameA: 'Jag', nameB: 'Min man', shareA: 50, homeValue: 0, horizon: 10, scenario: 0, real: false, inflation: 2, contribGrowth: 0, remind: true, gistAuto: false },
    posts: DEFAULT_POSTS.map(p => ({ ...p })), entries: {}, assump: {},
    meta: { lastSnapMonth: '', gistId: '', gistLast: 0 } };
}
function normalizeDb(d) {
  const b = emptyDb(); if (!d || typeof d !== 'object') return b;
  b.settings = Object.assign(b.settings, d.settings || {});
  b.posts = Array.isArray(d.posts) && d.posts.length ? d.posts.filter(p => p && p.id && KINDS[p.kind] && ['a', 'b', 's'].includes(p.owner)).map(p => ({ id: String(p.id), owner: p.owner, kind: p.kind, name: String(p.name || 'Post') })) : b.posts;
  b.entries = {}; if (d.entries && typeof d.entries === 'object') for (const mk in d.entries) if (/^\d{4}-\d{2}$/.test(mk)) { const o = {}; for (const id in d.entries[mk]) if (isFinite(d.entries[mk][id])) o[id] = +d.entries[mk][id]; if (Object.keys(o).length) b.entries[mk] = o; }
  b.assump = d.assump && typeof d.assump === 'object' ? d.assump : {};
  b.meta = Object.assign(b.meta, d.meta || {});
  b.appVersion = d.appVersion || APP_VERSION; b.model = DATA_MODEL; return b;
}
let db = emptyDb();
function loadDb() { try { const r = localStorage.getItem(LS_KEY); if (r) db = normalizeDb(JSON.parse(r)); } catch (e) { console.warn(e); } }
let warned = false;
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) { if (!warned) { warned = true; toast('Kunde inte spara i webbläsaren. Exportera en säkerhetskopia nu.'); } } }
function exportObj() { return { app: 'ournetworth', appVersion: APP_VERSION, dataModel: DATA_MODEL, exportedAt: new Date().toISOString(), data: { settings: db.settings, posts: db.posts, entries: db.entries, assump: db.assump } }; }
function applyImported(obj) {
  if (!obj || obj.app !== 'ournetworth' || !obj.data) throw new Error('Filen är inte en säkerhetskopia från den här appen.');
  const keep = db.meta; db = normalizeDb({ ...obj.data, meta: keep }); db.appVersion = APP_VERSION; save();
}

/* ---------- återställningspunkter ---------- */
const idb = {
  _db: null,
  open() { if (this._db) return Promise.resolve(this._db); return new Promise((res, rej) => { if (!window.indexedDB) return rej(new Error('IndexedDB saknas')); const r = indexedDB.open('ournetworth', 1); r.onupgradeneeded = () => r.result.createObjectStore('snaps', { keyPath: 'id', autoIncrement: true }); r.onsuccess = () => { this._db = r.result; res(r.result); }; r.onerror = () => rej(r.error); }); },
  async run(mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const tx = d.transaction('snaps', mode); const req = fn(tx.objectStore('snaps')); tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); }); },
  add(s) { return this.run('readwrite', st => st.add(s)); },
  all() { return this.run('readonly', st => st.getAll()).then(a => (a || []).sort((x, y) => y.at - x.at)); },
  get(id) { return this.run('readonly', st => st.get(id)); },
  del(id) { return this.run('readwrite', st => st.delete(id)); }
};
async function snapshot(label) {
  try { await idb.add({ at: Date.now(), label, n: Object.keys(db.entries).length, json: JSON.stringify(exportObj()) }); const all = await idb.all(); for (const s of all.slice(10)) await idb.del(s.id); }
  catch (e) { console.warn('Ingen återställningspunkt', e); }
}

/* ============================================================
   Beräkningar
   ============================================================ */
const S = { view: 'overview', sub: null, month: currentMonth(), emonth: currentMonth(), assumpOpen: false };
const post = id => db.posts.find(p => p.id === id);
const sortedMonths = () => Object.keys(db.entries).sort();
const firstMonth = () => sortedMonths()[0] || null;
const latestMonth = () => { const m = sortedMonths(); return m.length ? m[m.length - 1] : null; };
/* Saldo för en post en given månad. Saknas månaden används senast inmatade värde. */
function valueAt(id, mk) {
  const ms = sortedMonths(); for (let i = ms.length - 1; i >= 0; i--) { if (ms[i] > mk) continue; const v = db.entries[ms[i]][id]; if (v !== undefined) return { v, carried: ms[i] !== mk, from: ms[i] }; }
  return { v: null, carried: false, from: null };
}
function owners() { return [{ id: 'a', name: db.settings.nameA || 'Jag', color: 'var(--ca)', hex: '#0B5C5C' }, { id: 'b', name: db.settings.nameB || 'Min man', color: 'var(--cb)', hex: '#E08A2C' }, { id: 's', name: 'Gemensamt', color: 'var(--cs)', hex: '#7A5CC2' }]; }
function snapshotAt(mk) {
  const g = { a: 0, b: 0, s: 0 }; const per = {};
  for (const p of db.posts) { const r = valueAt(p.id, mk); per[p.id] = r; g[p.owner] += r.v || 0; }
  const sh = Math.min(100, Math.max(0, +db.settings.shareA || 0)) / 100;
  const total = g.a + g.b + g.s;
  return { g, per, total, a: g.a + g.s * sh, b: g.b + g.s * (1 - sh) };
}
function avgMonthlyChange(id, n = 6) {
  const pts = sortedMonths().filter(m => db.entries[m][id] !== undefined).slice(-(n + 1));
  if (pts.length < 2) return 0; const f = pts[0], l = pts[pts.length - 1];
  return (db.entries[l][id] - db.entries[f][id]) / Math.max(1, monthsBetween(f, l));
}
function defaultAssump(p) {
  const contrib = ['saving', 'invest', 'amort'].includes(p.kind) ? Math.max(0, Math.round(avgMonthlyChange(p.id) / 100) * 100) : 0;
  return { contrib, ret: KINDS[p.kind].ret };
}
function assumpOf(p) { const o = db.assump[p.id] || {}; const d = defaultAssump(p); return { contrib: o.contrib ?? d.contrib, ret: o.ret ?? d.ret, d, custom: o }; }
/* Prognos: månadsvis simulering, returnerar punkter för varje helt år */
function project(years, adj, real) {
  const last = latestMonth(); if (!last) return [];
  const st = db.settings; const sh = Math.min(100, Math.max(0, +st.shareA || 0)) / 100; const cg = (+st.contribGrowth || 0) / 100; const inf = (+st.inflation || 0) / 100;
  const base = {}, bal = {}, A = {}; for (const p of db.posts) { base[p.id] = valueAt(p.id, last).v || 0; bal[p.id] = base[p.id]; A[p.id] = assumpOf(p); }
  const V0 = +st.homeValue || 0; const pts = [];
  for (let m = 0; m <= years * 12; m++) {
    if (m > 0) for (const p of db.posts) {
      const a = A[p.id]; const grows = ['saving', 'invest', 'appr'].includes(p.kind); const r = (a.ret + (grows ? adj : 0)) / 100;
      if (p.kind === 'appr') bal[p.id] = base[p.id] + V0 * (Math.pow(1 + r, m / 12) - 1);
      else { const rm = Math.pow(1 + r, 1 / 12) - 1; const c = a.contrib * (['saving', 'invest'].includes(p.kind) ? Math.pow(1 + cg, Math.floor((m - 1) / 12)) : 1); bal[p.id] = bal[p.id] * (1 + rm) + c; }
    }
    if (m % 12 === 0) {
      const f = real ? 1 / Math.pow(1 + inf, m / 12) : 1; const g = { a: 0, b: 0, s: 0 }; for (const p of db.posts) g[p.owner] += bal[p.id] * f;
      pts.push({ y: m / 12, mk: addMonths(last, m), g, total: g.a + g.b + g.s, a: g.a + g.s * sh, b: g.b + g.s * (1 - sh) });
    }
  }
  return pts;
}

/* ============================================================
   Diagram
   ============================================================ */
function niceTicks(max) {
  if (max <= 0) return { top: 1, step: 1 }; const mag = Math.pow(10, Math.floor(Math.log10(max)));
  for (const k of [0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10]) { const step = k * mag; if (max / step <= 4) return { step, top: Math.ceil(max / step) * step }; }

function viewBackup() {
  const token = localStorage.getItem(LS_TOKEN) || ''; const n = Object.keys(db.entries).length; const ls = snapsCache[0];
  return backHead('Backup och versioner') + `
  <div class="card pad"><div class="t" style="font-size:14px;font-weight:600">Datan ligger bara i den här webbläsaren</div>
  <p class="note" style="margin-top:4px">Inget skickas till någon server, utom när du själv väljer Gist nedan. Rensar du webbläsarens data försvinner allt, så exportera en kopia då och då.</p>
  <div class="line" style="margin-top:6px"><div><div class="t">${n} månader inmatade · ${db.posts.length} poster</div><div class="s">${ls ? 'Senaste återställningspunkt ' + new Date(ls.at).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' }) : 'Inga återställningspunkter än'}</div></div></div>
  <div class="stack"><button class="btn primary" data-a="export">Exportera nu</button><button class="btn" data-a="restorefile">Återställ från fil</button></div></div>
  <h3>Kopia till privat GitHub Gist</h3>
  <div class="card pad" style="margin-top:8px"><p class="note" style="margin:0 0 8px">Skapa en token på GitHub med behörigheten <b>gist</b>. Den sparas bara i den här webbläsaren. En hemlig Gist är dold i listor men kan öppnas av den som har länken.</p>
  <input class="inp" id="gist-token" type="password" autocomplete="off" placeholder="GitHub-token" value="${esc(token)}" aria-label="GitHub-token">
  <div class="check" style="margin-top:6px"><input type="checkbox" id="gist-auto" ${db.settings.gistAuto ? 'checked' : ''} data-change="gistauto"><label for="gist-auto">Automatisk kopia varje vecka</label></div>
  <div class="small muted" style="margin-bottom:8px">${db.meta.gistLast ? 'Senaste Gist-kopia ' + new Date(db.meta.gistLast).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' }) : 'Ingen Gist-kopia än'}</div>
  <div class="stack"><button class="btn" data-a="gistsave">Spara kopia nu</button><button class="btn" data-a="gistrestore" ${db.meta.gistId ? '' : 'disabled'}>Hämta senaste kopian</button></div></div>
  <div class="card pad"><div class="check" style="min-height:40px"><input type="checkbox" id="remind" ${db.settings.remind ? 'checked' : ''} data-change="remind"><label for="remind">Påminn vid månadsskifte om att mata in saldon</label></div></div>
  <h3>Appversion</h3>
  <div class="card pad" style="margin-top:8px"><div class="line" style="padding-top:0"><div class="t">v${APP_VERSION}</div><div class="s">Datamodell ${DATA_MODEL}</div></div><p class="note" style="margin:0">Nytt i v${APP_VERSION}: ${esc(CHANGELOG[APP_VERSION] || '')}</p><div class="stack" style="margin-top:10px"><button class="btn" data-a="checkupdate">Sök efter uppdatering</button></div></div>
  <h3>Återställningspunkter</h3><p class="note" style="margin-top:4px">Skapas automatiskt före återställning och uppdatering samt vid månadsskifte. De tio senaste sparas i webbläsaren.</p>
  <div class="card" style="padding:2px 16px" id="snaps">${snapsHtml()}</div>`;
}

/* ---------- Sheets + toast ---------- */
function openSheet(html, focus) { $('#sheet-root').innerHTML = `<div class="back" data-a="sheetclose"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; const f = focus && $(focus, $('#sheet-root')); if (f) f.focus(); }
function closeSheet() { $('#sheet-root').innerHTML = ''; }
function postSheet(id) {
  const p = id ? post(id) : { name: '', owner: 'a', kind: 'saving' }; const O = owners();
  openSheet(`<h2>${id ? 'Ändra post' : 'Ny post'}</h2><label class="lbl2" for="ps-name">Namn</label><input class="inp" id="ps-name" value="${esc(p.name)}" autocomplete="off">
  <label class="lbl2" for="ps-owner">Vem</label><select class="inp" id="ps-owner">${O.map(o => `<option value="${o.id}" ${p.owner === o.id ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select>
  <label class="lbl2" for="ps-kind">Typ (styr hur prognosen räknar)</label><select class="inp" id="ps-kind">${Object.entries(KINDS).map(([k, v]) => `<option value="${k}" ${p.kind === k ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select>
  <div class="stack" style="margin-top:16px"><button class="btn primary" data-a="postsave" data-id="${id || ''}">Spara</button>${id ? `<button class="btn danger" data-a="postdel" data-id="${id}">Ta bort post och dess saldon</button>` : ''}<button class="btn" data-a="sheetclose" style="color:var(--soft)">Avbryt</button></div>`, '#ps-name');
}
let toastTimer = null;
function toast(msg, action) { const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button data-a="${action.a}">${esc(action.label)}</button>` : ''}`; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), action ? 9000 : 4200); }

/* ---------- backup ---------- */
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
async function gistSave(silent) {
  const token = localStorage.getItem(LS_TOKEN); if (!token) { if (!silent) toast('Klistra in en GitHub-token först.'); return false; }
  try {
    const body = { description: 'Our Net Worth – säkerhetskopia', public: false, files: { 'ournetworth-backup.json': { content: JSON.stringify(exportObj()) } } };
    const r = await fetch('https://api.github.com/gists' + (db.meta.gistId ? '/' + db.meta.gistId : ''), { method: db.meta.gistId ? 'PATCH' : 'POST', headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status === 401 ? 'GitHub avvisade token (401). Kontrollera behörigheten gist.' : 'GitHub svarade ' + r.status);
    const j = await r.json(); db.meta.gistId = j.id; db.meta.gistLast = Date.now(); save(); if (!silent) toast('Kopia sparad i din Gist'); return true;
  } catch (e) { toast(silent ? 'Automatisk Gist-kopia misslyckades: ' + e.message : e.message); return false; }
}
async function gistRestore() {
  const token = localStorage.getItem(LS_TOKEN); if (!token || !db.meta.gistId) { toast('Ingen Gist-kopia att hämta.'); return; }
  try {
    const r = await fetch('https://api.github.com/gists/' + db.meta.gistId, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('GitHub svarade ' + r.status);
    const j = await r.json(); const f = j.files['ournetworth-backup.json'] || Object.values(j.files)[0]; let c = f.content; if (f.truncated) c = await (await fetch(f.raw_url)).text();
    const obj = JSON.parse(c); if (!confirm(`Ersätta nuvarande data (${Object.keys(db.entries).length} månader) med kopian (${Object.keys(obj.data?.entries || {}).length})? En återställningspunkt skapas först.`)) return;
    await snapshot('Före återställning från Gist'); applyImported(obj); await refreshSnaps(); render(true); toast('Återställt från Gist');
  } catch (e) { toast(e.message || 'Kunde inte hämta kopian.'); }
}

/* ============================================================
   Händelser
   ============================================================ */
const ACT = {
  nav(el) { S.view = el.dataset.v; S.sub = null; render(); },
  back() { S.sub = null; render(); },
  sub(el) { S.sub = el.dataset.v; if (S.sub === 'backup') refreshSnaps(true); render(); },
  mprev() { S.month = addMonths(S.month, -1); render(true); },
  mnext() { S.month = addMonths(S.month, 1); render(true); },
  eprev() { S.emonth = addMonths(S.emonth, -1); render(true); },
  enext() { if (S.emonth < currentMonth()) { S.emonth = addMonths(S.emonth, 1); render(true); } },
  efill() { document.querySelectorAll('#main input[data-post]').forEach(i => { if (!i.value.trim()) { const v = valueAt(i.dataset.post, addMonths(S.emonth, -1)).v; if (v !== null) { i.value = String(v).replace('.', ','); i.dispatchEvent(new Event('input', { bubbles: true })); } } }); },
  esave() {
    const mk = S.emonth; const o = {}; let bad = 0;
    document.querySelectorAll('#main input[data-post]').forEach(i => { const t = i.value.trim(); if (!t) return; const v = parseNum(t); if (v === null) bad++; else o[i.dataset.post] = Math.round(v * 100) / 100; });
    if (bad) { toast(`${bad} rutor har värden som inte går att läsa som tal.`); return; }
    if (Object.keys(o).length) db.entries[mk] = o; else delete db.entries[mk];
    save(); S.month = mk; S.view = 'overview'; render(); toast(`Saldon för ${monthName(mk)} sparade`);
  },
  horizon(el) { db.settings.horizon = +el.dataset.v; save(); render(true); },
  scenario(el) { db.settings.scenario = +el.dataset.v; save(); render(true); },
  real(el) { db.settings.real = el.dataset.v === '1'; save(); render(true); },
  assump() { S.assumpOpen = !S.assumpOpen; render(true); },
  postadd() { postSheet(null); },
  postedit(el) { postSheet(el.dataset.id); },
  postsave(el) {
    const name = $('#ps-name').value.trim(); if (!name) { toast('Ge posten ett namn.'); return; }
    const owner = $('#ps-owner').value, kind = $('#ps-kind').value; const id = el.dataset.id;
    if (id) { const p = post(id); p.name = name; p.owner = owner; p.kind = kind; } else db.posts.push({ id: 'p' + uid(), owner, kind, name });
    save(); closeSheet(); render(true);
  },
  postdel(el) {
    const id = el.dataset.id; const p = post(id); if (!confirm(`Ta bort “${p.name}” och alla dess saldon? Det går inte att ångra, men du kan exportera en kopia först.`)) return;
    db.posts = db.posts.filter(x => x.id !== id); for (const m in db.entries) { delete db.entries[m][id]; if (!Object.keys(db.entries[m]).length) delete db.entries[m]; } delete db.assump[id];
    save(); closeSheet(); render(true);
  },
  sheetclose(el, e) { if (e.target === el || el.tagName === 'BUTTON') closeSheet(); },
  export() { download(`ournetworth-backup-${isoDate(new Date())}.json`, JSON.stringify(exportObj())); toast('Säkerhetskopian är nedladdad'); },
  restorefile() { const i = $('#file-restore'); i.value = ''; i.click(); },
  gistsave() { const v = $('#gist-token').value.trim(); if (v) localStorage.setItem(LS_TOKEN, v); gistSave(false).then(() => render(true)); },
  gistrestore() { gistRestore(); },
  async snaprestore(el) {
    const s = await idb.get(+el.dataset.id); if (!s) return;
    if (!confirm(`Återställa till ${new Date(s.at).toLocaleString('sv-SE', { dateStyle: 'medium', timeStyle: 'short' })}? Nuvarande data sparas först som en ny återställningspunkt.`)) return;
    await snapshot('Före återställning'); try { applyImported(JSON.parse(s.json)); } catch (e) { toast(e.message); return; }
    await refreshSnaps(); render(true); toast('Återställt');
  },
  checkupdate() { if (!navigator.serviceWorker) { toast('Uppdateringar hanteras av webbläsaren.'); return; } navigator.serviceWorker.getRegistration().then(r => r ? r.update().then(() => toast('Du har den senaste versionen, eller så laddas en ny i bakgrunden.')) : toast('Ingen uppdatering hittades.')); },
  reload() { location.reload(); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el) return; const fn = ACT[el.dataset.a]; if (fn) fn(el, e); });
document.addEventListener('change', e => {
  const el = e.target; const k = el.dataset && el.dataset.change; if (!k) return; const st = db.settings;
  if (k === 'nameA' || k === 'nameB') { st[k] = el.value.trim() || (k === 'nameA' ? 'Jag' : 'Min man'); save(); if (latestMonth()) render(true); }
  else if (k === 'shareA') { const v = parseNum(el.value); st.shareA = v === null ? 50 : Math.min(100, Math.max(0, v)); save(); render(true); }
  else if (k === 'homeValue') { const v = parseNum(el.value); st.homeValue = v === null || v < 0 ? 0 : v; save(); render(true); }
  else if (k === 'contribGrowth' || k === 'inflation') { const v = parseNum(el.value); st[k] = v === null ? 0 : v; save(); render(true); }
  else if (k === 'acontrib' || k === 'aret') {
    const id = el.dataset.id; const f = k === 'acontrib' ? 'contrib' : 'ret'; const v = parseNum(el.value); db.assump[id] = db.assump[id] || {};
    if (v === null) delete db.assump[id][f]; else db.assump[id][f] = v; if (!Object.keys(db.assump[id]).length) delete db.assump[id]; save(); render(true);
  }
  else if (k === 'remind') { st.remind = el.checked; save(); }
  else if (k === 'gistauto') { st.gistAuto = el.checked; save(); const v = $('#gist-token'); if (v && v.value.trim()) localStorage.setItem(LS_TOKEN, v.value.trim()); }
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.post) return;
  const v = el.value.trim() ? parseNum(el.value) : null; const d = $('#fd-' + el.dataset.post); if (d) d.textContent = deltaFor(el.dataset.post, v, S.emonth);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#file-restore').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const obj = JSON.parse(await f.text()); if (!obj || obj.app !== 'ournetworth') throw new Error('Filen är inte en säkerhetskopia från den här appen.');
    if (!confirm(`Ersätta nuvarande data (${Object.keys(db.entries).length} månader) med kopian (${Object.keys(obj.data?.entries || {}).length})? En återställningspunkt skapas först.`)) return;
    await snapshot('Före återställning från fil'); applyImported(obj); await refreshSnaps(); render(true); toast('Återställt från fil');
  } catch (err) { toast(err.message || 'Kunde inte läsa filen.'); }
});

/* ============================================================
   Start
   ============================================================ */
async function boot() {
  loadDb(); const last = latestMonth(); S.month = last || currentMonth();
  if (last) {
    if (db.appVersion && db.appVersion !== APP_VERSION) await snapshot(`Före uppdatering till v${APP_VERSION}`);
    if (db.meta.lastSnapMonth !== currentMonth()) { await snapshot('Månadsskifte'); db.meta.lastSnapMonth = currentMonth(); }
  }
  db.appVersion = APP_VERSION; save(); render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  if (db.settings.gistAuto && last && localStorage.getItem(LS_TOKEN) && Date.now() - (db.meta.gistLast || 0) > 7 * 86400000) gistSave(true);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const had = !!navigator.serviceWorker.controller; navigator.serviceWorker.register('./sw.js').catch(() => { });
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('Appen har uppdaterats.', { a: 'reload', label: 'Ladda om' }); });
  }
}
boot();
</script>
